name: Build Android APK
​on: [push]
​jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
​- name: Unzip Project
run: unzip nexa-native-4.zip -d extracted_project
​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Build APK
run: |
cd extracted_project/*
chmod +x gradlew
./gradlew assembleDebug --no-daemon
​- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: app-debug
path: extracted_project/*/app/build/outputs/apk/debug/app-debug.apk
