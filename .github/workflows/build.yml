name: Build Android APK
​on:
push:
branches: [ main ]
​jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Unzip Project
run: |
if [ -f nexa-native-4.zip ]; then
unzip nexa-native-4.zip -d extracted_project
else
echo "Zip file not found"
exit 1
fi
​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Build APK with Gradle
run: |
cd extracted_project/*
chmod +x gradlew
./gradlew assembleDebug --no-daemon
​- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: app-debug
path: extracted_project/*/app/build/outputs/apk/debug/app-debug.apk
